[workspace]
members = [
    "crates/libchess-core",
    "crates/libchess-lichess",
    "crates/libchess",
    "crates/libchess-ffi",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
async-trait = "0.1"
libchess-core = { path = "crates/libchess-core" }
libchess-lichess = { path = "crates/libchess-lichess" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls-no-alpn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

